[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-megatron-engine"
version = "0.6.0"
description = "A slim Megatron-style dense GPT training engine for education."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nanoMegatronEngine contributors" }]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["nano_megatron_engine*"]
